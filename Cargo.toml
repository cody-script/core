[workspace]
resolver = "3"
members = [
    "crates/codyscript-core",
    "crates/codyscript-json",
    "crates/codyscript-text",
    "crates/codyscript-wasm",
    "crates/codyscript-playground",
    "crates/codyscript-bench",
]

[workspace.package]
version = "0.12.0"
edition = "2024"
rust-version = "1.99"
authors = ["Cody Pope"]
license = "MIT"
homepage = "https://github.com/cody-script/core#readme"
repository = "https://github.com/cody-script/core"

[workspace.dependencies]
codyscript-core = { path = "crates/codyscript-core", version = "0.12.0" }
codyscript-json = { path = "crates/codyscript-json", version = "0.12.0" }
codyscript-wasm = { path = "crates/codyscript-wasm" }
serde = { version = "1", features = ["derive"] }
# Pinned together: the generated JavaScript glue must come from exactly the
# version of wasm-bindgen the module was built with. (For the CLI and the test
# runner: `cargo install wasm-bindgen-cli --version 0.2.130`.)
wasm-bindgen = "=0.2.130"
wasm-bindgen-cli-support = "=0.2.130"
serde_json = "1"
