name: ci
# Pushes to main run CI through release.yml, so it isn't triggered twice here.
on:
  pull_request:
  workflow_call:
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Must equal the workspace's pinned wasm-bindgen (Cargo.toml).
  WASM_BINDGEN_VERSION: 0.2.130
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # Dependencies point inward: the core's only runtime dependency is serde.
      - name: The core depends on serde only
        run: |
          deps=$(cargo tree -p codyscript-core -e normal --depth 1 --prefix none \
            | grep -v '^codyscript-core ' | cut -d' ' -f1 | sort -u)
          echo "codyscript-core depends on: $deps"
          if [ "$deps" != "serde" ]; then
            echo "::error file=crates/codyscript-core/Cargo.toml::codyscript-core may depend on serde only; it depends on: $(echo $deps)"
            exit 1
          fi

  # The library crates build on their MSRV, from a lockfile resolved to
  # versions that support it. (Only check: the dev-dependencies need newer.)
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@1.77
      - uses: Swatinem/rust-cache@v2
      - run: cargo +stable generate-lockfile
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
      - run: cargo +1.77 check -p codyscript-core -p codyscript-json

  # Single-threaded WebAssembly, in Node: the bindings, and the deepest
  # default-limit programs on WebAssembly's 1 MiB stack.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}
      - run: cargo test -p codyscript-wasm --target wasm32-unknown-unknown
      - run: cargo bench -p codyscript-bench --target wasm32-unknown-unknown --bench wasm --no-run
      # The npm package release.yml publishes, loaded as a Node user would.
      - run: crates/codyscript-wasm/npm/build.sh
      - run: node crates/codyscript-wasm/npm/smoke.mjs target/npm

  # Releases happen when a merge bumps the version, so a PR that changes what
  # ships without bumping it would merge and never be released.
  version-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require a version bump when shipped files change
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # The published crates and npm package (less their tests), and the
          # workspace manifest they inherit from. They share one version.
          shipped=$(git diff --name-only "$BASE"...HEAD -- Cargo.toml \
            crates/codyscript-core ':(exclude)crates/codyscript-core/tests' \
            crates/codyscript-json ':(exclude)crates/codyscript-json/tests' \
            crates/codyscript-wasm ':(exclude)crates/codyscript-wasm/tests')
          if [ -z "$shipped" ]; then
            echo "No shipped files changed; no version bump needed."
            exit 0
          fi
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "codyscript-core") | .version')
          echo "Shipped files changed:"; echo "$shipped"
          status=$(curl -s -o /dev/null -w '%{http_code}' -A "${{ github.repository }} CI" \
            "https://crates.io/api/v1/crates/codyscript-core/$version")
          if [ "$status" = 200 ]; then
            echo "::error file=Cargo.toml::Shipped files changed but $version is already on crates.io. Bump [workspace.package] version so merging releases this change."
            exit 1
          fi
          echo "Merging will release $version."
