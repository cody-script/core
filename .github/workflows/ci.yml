name: ci
# Pushes to main run CI through release.yml, so it isn't triggered twice here.
on:
  pull_request:
  workflow_call:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run type-check
      - run: bun run test:coverage
      - run: bun run build
