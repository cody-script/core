name: release
# A merge to main releases when it changes the version in package.json:
# CI, then publish to GitHub Packages, then tag v<version> with a GitHub
# release whose notes list the merged PRs. A merge that leaves the version
# alone (docs, tests) releases nothing. Re-run from the Actions tab
# (workflow_dispatch) to retry a release that failed partway.
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      released: ${{ steps.read.outputs.released }}
    steps:
      - uses: actions/checkout@v5
      - id: read
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version is already released; bump version in package.json to release."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: version
    if: needs.version.outputs.released == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: "https://npm.pkg.github.com"
          scope: "@cody-script"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Skip if a retry finds this version already published.
          if npm view "@cody-script/engine@$VERSION" version > /dev/null 2>&1; then
            echo "::notice::@cody-script/engine@$VERSION is already published."
          else
            npm publish
          fi
      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
