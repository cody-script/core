[package]
name = "codyscript-wasm"
description = "CodyScript in WebAssembly: run JSON programs from JavaScript, with executors written in JavaScript."
publish = false
readme = "README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
codyscript-core.workspace = true
codyscript-json.workspace = true
serde.workspace = true
# Pinned in the workspace: the JavaScript glue must be generated by exactly
# this version (`cargo install wasm-bindgen-cli --version 0.2.130`).
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3.107"
# JavaScript values aren't `Send`; the engine's executors must be. Browser
# WebAssembly has one thread, so this wrapper (which checks that at runtime)
# bridges the two without `unsafe` here or any change to the core.
send_wrapper = { version = "0.6", features = ["futures"] }
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3.80"
